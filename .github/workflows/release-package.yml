name: Release Package

# Release publication for @viceme-ai/sdk, following the reviewed
# ViceMe-AI/cli release.yml baseline (OIDC trusted publishing, immutable
# tag binding, publish-or-verify convergence) and adding the SDK's own
# tarball/CDN asset steps:
#
#   1. Changesets opens Version PRs only (no publishing from the action).
#   2. On main push: resolve the version from packages/sdk/package.json.
#      A version without a tag is a new release; a version whose tag already
#      points at this SHA is a recovery run; anything else fails (immutable
#      tags never move).
#   3. Full quality gate reruns at the exact reviewed SHA.
#   4. An annotated immutable tag @viceme-ai/sdk@<version> is created (or
#      verified in recovery).
#   5. npm publication via OIDC trusted publishing — NO publish token is
#      injected; the OIDC-capable npm CLI is pinned; the OIDC context is
#      verified; scripts/publish-or-verify.mjs converges (already-published
#      versions with matching integrity are a success, mismatched integrity
#      fails closed).
#   6. CDN artifacts are attached to the GitHub release from the published
#      npm tarball (attach-release-assets.mjs) and the dist-tag is read back
#      publicly. If these post-publish steps fail, re-run this workflow with
#      the same tag input (recovery) or the Release Assets workflow.
#
# 0.x publishes under the `next` dist-tag (DIST_TAG + .changeset/pre.json);
# flip to `latest` at 1.0.0 in the same release PR that exits pre mode.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to recover, e.g. @viceme-ai/sdk@0.1.1-next.0'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  # 0.x phase (§14.1): publish under `next` only. Flip to `latest` at 1.0.0
  # and remove .changeset/pre.json in the same release PR.
  DIST_TAG: next

concurrency:
  # Serialize releases: npm dist-tags have no compare-and-swap.
  group: viceme-sdk-release
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version Packages PR (Changesets, no publishing)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metadata:
    name: Resolve and validate immutable release identity
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      recovery: ${{ steps.release.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version, tag, and recovery mode
        id: release
        env:
          RECOVERY_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          TAG="@viceme-ai/sdk@${VERSION}"
          SHA="$(git rev-parse HEAD)"
          git fetch origin --tags

          RECOVERY=false
          if [ -n "$RECOVERY_TAG" ]; then
            RECOVERY=true
            if [ "$RECOVERY_TAG" != "$TAG" ]; then
              echo "::error::recovery tag ${RECOVERY_TAG} does not match package version ${VERSION}"
              exit 1
            fi
          fi

          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$SHA" ]; then
            echo "::error::immutable tag ${TAG} already points to ${EXISTING_SHA}, not ${SHA}"
            exit 1
          fi
          if [ "$RECOVERY" = true ] && [ -z "$EXISTING_SHA" ]; then
            echo "::error::recovery requires an existing immutable tag ${TAG}"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "recovery=${RECOVERY}"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality (exact reviewed SHA)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full gate (format, lint, types, contract drift, tests, browsers, tarball)
        run: |
          pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps chromium firefox webkit
          pnpm check

  tag:
    name: Create or verify immutable release tag
    needs:
      - metadata
      - quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "$RELEASE_SHA"
            exit 0
          fi
          git tag --annotate "${TAG}" "${RELEASE_SHA}" --message "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

  npm-publish:
    name: npm publication (OIDC, no publish token)
    needs:
      - metadata
      - tag
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned OIDC-capable npm CLI
        run: npm install --global npm@11.12.1
      - name: Verify trusted publisher OIDC context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: pnpm install --frozen-lockfile
      - name: Release gate (license fail closed)
        run: pnpm release:gate
      - name: Build and audit the exact release artifacts
        run: pnpm build && pnpm pack:check
      - name: Publish or verify the exact npm version
        env:
          VICEME_SDK_DIST_TAG: 'next'
        run: node scripts/publish-or-verify.mjs

  assets:
    name: Attach CDN assets + dist-tag read-back
    needs:
      - metadata
      - npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Attach CDN artifacts from the published npm tarball (immutable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY: ${{ needs.metadata.outputs.recovery }}
        run: |
          # The dist-tag read-back is the immediate post-publish gate only;
          # recovery runs go straight to convergent asset attachment.
          if [ "$RECOVERY" != "true" ]; then
            node scripts/verify-npm-dist-tag.mjs \
              --package '@viceme-ai/sdk' --version "$VERSION" --tag next
          fi
          node scripts/attach-release-assets.mjs --version "$VERSION"
