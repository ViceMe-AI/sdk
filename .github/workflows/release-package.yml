name: Release Package

# Release publication for @viceme-ai/sdk, following the reviewed
# ViceMe-AI/cli release.yml baseline (OIDC trusted publishing, immutable
# tag binding, publish-or-verify convergence) plus the SDK's own tarball/CDN
# asset steps.
#
# Release binding (review P1): a normal release happens ONLY for the merge
# commit of a reviewed Changesets "Version Packages" PR — ordinary feature
# or doc pushes resolve to skip=true and never touch tags or npm. Recovery
# runs (workflow_dispatch tag input) check out an existing immutable tag.
#
# Ordering (review P1): every fail-closed gate (full quality gate, license
# gate, forbidden-pattern scan) completes at the exact release SHA BEFORE
# any external write (tag, registry, release assets).
#
# Actions are pinned to reviewed commit SHAs; each job carries only the
# permissions it needs.
#
# 0.x publishes under the `next` dist-tag — DIST_TAG below is the single
# authoritative source read by both publish-or-verify.mjs and the
# post-publish read-back. Flip it to `latest` at 1.0.0 (same release PR
# that exits Changesets pre mode and removes .changeset/pre.json).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to recover, e.g. @viceme-ai/sdk@0.1.1-next.0'
        required: false
        type: string

env:
  DIST_TAG: next

concurrency:
  # Serialize releases: npm dist-tags have no compare-and-swap.
  group: viceme-sdk-release
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version Packages PR (Changesets, no publishing)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@8eb63fb4cfc7f9643537c7d39d0b68c835012a19 # v1.5.3
        with:
          version: pnpm release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  context:
    name: Resolve merged Version Packages PR or recovery tag
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.context.outputs.skip }}
      recovery: ${{ steps.context.outputs.recovery }}
      release_ref: ${{ steps.context.outputs.release_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RECOVERY_TAG: ${{ inputs.tag || '' }}
        run: node scripts/resolve-release-context.mjs

  metadata:
    name: Resolve and validate immutable release identity
    needs: context
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.context.outputs.release_ref }}
          fetch-depth: 0
      - name: Resolve version and immutable tag binding
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          TAG="@viceme-ai/sdk@${VERSION}"
          SHA="$(git rev-parse HEAD)"
          git fetch origin --tags

          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$SHA" ]; then
            echo "::error::immutable tag ${TAG} already points to ${EXISTING_SHA}, not ${SHA}"
            exit 1
          fi
          # Same SHA + existing tag = idempotent rerun; no tag = new release.
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality + fail-closed gates (exact release SHA)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License gate (fail closed before any external write)
        run: pnpm release:gate
      - name: Forbidden-pattern scan
        run: node scripts/scan-forbidden-patterns.mjs
      - name: Full quality gate
        run: |
          pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps chromium firefox webkit
          pnpm check

  tag:
    name: Create or verify immutable release tag
    needs:
      - metadata
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_SHA="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "$RELEASE_SHA"
            exit 0
          fi
          git tag --annotate "${TAG}" "${RELEASE_SHA}" --message "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

  npm-publish:
    name: npm publication (OIDC, no publish token)
    needs:
      - metadata
      - tag
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned OIDC-capable npm CLI
        run: npm install --global npm@11.12.1
      - name: Verify trusted publisher OIDC context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: pnpm install --frozen-lockfile
      - name: License gate (again, at publish time)
        run: pnpm release:gate
      - name: Build and audit the exact release artifacts
        run: pnpm build && pnpm pack:check
      # DIST_TAG comes from the workflow-level env — the same authoritative
      # variable the post-publish read-back uses.
      - name: Publish or verify the exact npm version
        run: node scripts/publish-or-verify.mjs

  assets:
    name: Attach CDN assets + dist-tag read-back
    needs:
      - metadata
      - npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Attach CDN artifacts from the published npm tarball (immutable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY: ${{ needs.context.outputs.recovery }}
        run: |
          # The dist-tag read-back is the immediate post-publish gate only;
          # recovery runs go straight to convergent asset attachment.
          if [ "$RECOVERY" != "true" ]; then
            node scripts/verify-npm-dist-tag.mjs \
              --package '@viceme-ai/sdk' --version "$VERSION" --tag "$DIST_TAG"
          fi
          node scripts/attach-release-assets.mjs --version "$VERSION"
