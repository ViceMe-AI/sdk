name: Release Package

# Changesets flow (§14.2):
#   1. PR merged to main with pending changesets -> this workflow opens the
#      "Version Packages" PR (no publish).
#   2. Version PR merged -> tag exists on main -> quality gates rerun, then
#      npm publish via OIDC trusted publishing with provenance.
#   3. The same build's CDN artifacts are attached to the GitHub release for
#      the promote-cdn workflow — npm tarball and CDN objects always come
#      from one build.
#
# Publishing preconditions (machine-enforced in `pnpm release:publish`,
# which runs `pnpm release:gate` first):
#   - final LICENSE exists and LICENSE-PENDING.md is gone;
#   - 0.x publishes under the `next` dist-tag only (DIST_TAG below + the
#     committed .changeset/pre.json); the post-publish step verifies the
#     live npm dist-tag read-back.
#
# Required org configuration (one-time, needs owner permissions):
#   - GitHub environment `npm` with required reviewers.
#   - `@viceme-ai` npm scope configured for trusted publishing
#     (repository + workflow + environment), no long-lived tokens.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 0.x phase (§14.1): publish under `next` only. Flip to `latest` at 1.0.0
  # and remove .changeset/pre.json in the same release PR.
  DIST_TAG: next

jobs:
  release:
    name: Version / publish (OIDC + provenance)
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release quality gate (all PR checks rerun)
        run: |
          pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps chromium firefox webkit
          pnpm check

      - name: Changesets (version PR or publish)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Verify npm dist-tag read-back
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          node scripts/verify-npm-dist-tag.mjs \
            --package '@viceme-ai/sdk' --version "$version" --tag "$DIST_TAG"

      - name: Attach CDN artifacts to the GitHub release (immutable)
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/package.json').version")"
          tag="@viceme-ai/sdk@${version}"
          mkdir -p release-artifacts
          cp packages/sdk/dist/manifest.json release-artifacts/
          (cd packages/sdk/dist && zip -qr "$GITHUB_WORKSPACE/release-artifacts/dist-${version}.zip" .)
          pnpm --filter '@viceme-ai/sdk' pack --pack-destination release-artifacts

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release exists; verifying assets instead of overwriting"
            mkdir -p existing-assets
            gh release download "$tag" --dir existing-assets --clobber
            missing=()
            for file in release-artifacts/*; do
              base="$(basename "$file")"
              if [ -f "existing-assets/$base" ]; then
                cmp -s "$file" "existing-assets/$base" || {
                  echo "::error::release asset $base differs from the existing one (exact versions are immutable)"
                  exit 1
                }
                echo "asset $base already attached and byte-identical"
              else
                missing+=("$base")
              fi
            done
            if [ ${#missing[@]} -gt 0 ]; then
              gh release upload "$tag" "${missing[@]/#/release-artifacts/}"
            fi
          else
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes "Release artifacts for ${version}. CDN promotion: run the Promote CDN workflow against this tag." \
              release-artifacts/*
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
