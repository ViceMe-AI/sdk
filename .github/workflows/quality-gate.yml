name: Quality Gate

on:
  pull_request:

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify PR head
    runs-on: ubuntu-latest
    outputs:
      run-full: ${{ steps.classify.outputs.run-full }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: classify
        name: Decide whether the promotion head is final
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          PR_HEAD_SUBJECT="$(git log -1 --format=%s)"
          PR_HEAD_BODY="$(git log -1 --format=%B)"
          PR_HEAD_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export PR_HEAD_SUBJECT PR_HEAD_BODY PR_HEAD_AUTHOR_EMAIL
          echo "run-full=$(bash scripts/ci/validate-pr-target.sh --should-run-full-checks)" >>"${GITHUB_OUTPUT}"
      - name: Test pull request target contract
        run: bash scripts/ci/validate-pr-target.sh --self-test

  check:
    name: Format, lint, types, unit tests, build, tarball audit
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate protected branch pull request target
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: bash scripts/ci/validate-pr-target.sh

      - name: Test pull request target contract
        run: bash scripts/ci/validate-pr-target.sh --self-test

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: needs.classify.outputs.run-full == 'true'
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.run-full == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format check
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm format:check

      # Workflow gate: js-yaml pre-check (duplicate keys, structural
      # errors, floating action tags) + actionlint 1.7.7 semantics
      # (schema, expressions, events). actionlint is digest-pinned and
      # cross-platform via the same Node wrapper contributors run locally.
      - name: Workflow gate (syntax + actionlint semantics)
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm workflows:check

      - name: Lint
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm typecheck

      - name: Contract drift gate
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm contracts:check

      # The gate itself is side-effect free; this asserts nothing in the
      # working tree changed during the whole check job.
      - name: Working tree must be clean after gates
        if: needs.classify.outputs.run-full == 'true'
        run: git diff --exit-code -- contracts packages/sdk/src/generated

      - name: Unit tests
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm test

      - name: Build (clean -> esm -> loader -> types -> manifest)
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm build

      - name: Tarball audit, public surface, size budget
        if: needs.classify.outputs.run-full == 'true'
        run: pnpm pack:check

      - name: Secret and internal-endpoint scan
        if: needs.classify.outputs.run-full == 'true'
        run: node scripts/scan-forbidden-patterns.mjs

      - name: Whitespace / conflict marker check
        if: needs.classify.outputs.run-full == 'true'
        run: git diff --check

  browser:
    name: Browser matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [classify, check]
    if: needs.classify.outputs.run-full == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts under test
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run loader fixture tests
        run: pnpm --filter '@viceme-ai/sdk' exec playwright test --project=${{ matrix.browser }}

  fixtures:
    name: Framework fixtures build from workspace
    runs-on: ubuntu-latest
    needs: [classify, check]
    if: needs.classify.outputs.run-full == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK package
        run: pnpm build

      - name: Build React + Vite fixture
        run: pnpm --filter '@viceme-ai/example-react-vite' build

      - name: Build Next.js fixture
        run: pnpm --filter '@viceme-ai/example-nextjs' build

  tarball-fixtures:
    name: Install fixtures from the real npm tarball
    runs-on: ubuntu-latest
    needs: [classify, check]
    if: needs.classify.outputs.run-full == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @viceme-ai/sdk
        run: pnpm --filter '@viceme-ai/sdk' build

      - name: Pack @viceme-ai/sdk
        run: pnpm --filter '@viceme-ai/sdk' pack --pack-destination "${{ github.workspace }}"

      # Build the React fixture in a standalone workspace (outside the repo)
      # whose dependency is the real tarball — proving what an npm consumer
      # installs, not workspace sources.
      - name: Build the React fixture from the real tarball (standalone)
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          tarball="$(pwd)/viceme-ai-sdk-${version}.tgz"
          root="$(mktemp -d)/viceme-tarball-check"
          mkdir -p "$root"
          cp -r examples/react-vite "$root/app"
          # The example tsconfig extends ../../tsconfig.base.json (two levels up
          # from the app directory = the parent of $root).
          cp tsconfig.base.json "$(dirname "$root")/"
          rm -rf "$root/app/node_modules"
          cat > "$root/pnpm-workspace.yaml" <<'YAML'
          packages:
            - app
          allowBuilds:
            esbuild: true
          YAML
          node -e "
            const fs = require('node:fs');
            const path = process.argv[1] + '/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies['@viceme-ai/sdk'] = 'file:' + process.argv[2];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          " "$root" "$tarball"
          cd "$root" && pnpm install --no-frozen-lockfile && pnpm --filter app build
