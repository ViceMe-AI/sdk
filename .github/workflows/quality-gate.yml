name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, unit tests, build, tarball audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (clean -> esm -> loader -> types -> manifest)
        run: pnpm build

      - name: Tarball audit, public surface, size budget
        run: pnpm pack:check

      - name: Secret and internal-endpoint scan
        run: node scripts/scan-forbidden-patterns.mjs

      - name: Whitespace / conflict marker check
        run: git diff --check

  browser:
    name: Browser matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts under test
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run loader fixture tests
        run: pnpm --filter '@viceme-ai/sdk' exec playwright test --project=${{ matrix.browser }}

  fixtures:
    name: Framework fixtures build from workspace
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK package
        run: pnpm build

      - name: Build React + Vite fixture
        run: pnpm --filter '@viceme-ai/example-react-vite' build

      - name: Build Next.js fixture
        run: pnpm --filter '@viceme-ai/example-nextjs' build

  tarball-fixtures:
    name: Install fixtures from the real npm tarball
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack @viceme-ai/sdk
        run: pnpm --filter '@viceme-ai/sdk' pack --pack-destination "${{ github.workspace }}"

      - name: Re-point fixtures at the tarball and build
        run: |
          tarball="$(pwd)/viceme-ai-sdk-$(node -p "require('./packages/sdk/package.json').version").tgz"
          pnpm --filter '@viceme-ai/example-react-vite' remove '@viceme-ai/sdk'
          pnpm --filter '@viceme-ai/example-react-vite' add "file:${tarball}"
          pnpm --filter '@viceme-ai/example-react-vite' build
