name: SDK release preparation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: viceme-sdk-release-pr
  cancel-in-progress: true

jobs:
  prepare:
    name: Release candidate preparation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.base_ref == 'main' &&
       github.head_ref == 'dev' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: release-app-token
        name: Create repository-scoped Release App token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - id: release-app-user
        name: Resolve Release App bot identity
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          ref: dev
          fetch-depth: 0
      - id: release-head
        name: Detect an already prepared Release Bot head
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          PR_HEAD_SUBJECT="$(git log -1 --format=%s)"
          PR_HEAD_BODY="$(git log -1 --format=%B)"
          PR_HEAD_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export PR_HEAD_SUBJECT PR_HEAD_BODY PR_HEAD_AUTHOR_EMAIL
          echo "prepared=$(bash scripts/ci/validate-pr-target.sh --is-prepared-release-commit)" >>"${GITHUB_OUTPUT}"
      - name: Fetch stable branch and release tags
        if: steps.release-head.outputs.prepared != 'true'
        run: git fetch origin main --tags
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.release-head.outputs.prepared != 'true'
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release-head.outputs.prepared != 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.release-head.outputs.prepared != 'true'
        run: pnpm install --frozen-lockfile
      - name: Compute version and changelog from Conventional Commits
        if: steps.release-head.outputs.prepared != 'true'
        run: pnpm release:prepare
      - name: Require a stable release version
        if: steps.release-head.outputs.prepared != 'true'
        run: |
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release preparation must produce a stable semantic version, got ${VERSION}"
            exit 1
          fi
      - name: Format generated release files
        if: steps.release-head.outputs.prepared != 'true'
        run: pnpm exec prettier --write packages/sdk/package.json packages/sdk/CHANGELOG.md packages/sdk/src/version.ts
      - name: Verify prepared release
        if: steps.release-head.outputs.prepared != 'true'
        run: |
          pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps chromium firefox webkit
          pnpm check
          git diff --check
      - id: release
        name: Commit prepared release to protected dev
        if: steps.release-head.outputs.prepared != 'true'
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.release-app-user.outputs.user-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          MAIN_VERSION="$(git show origin/main:packages/sdk/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          TAG="@viceme-ai/sdk@${VERSION}"
          RELEASE_TRAILERS="$(printf 'ViceMe-Release-Prepared: true\nViceMe-Release-Run: %s' "${RUN_URL}")"
          if [[ "${VERSION}" == "${MAIN_VERSION}" ]]; then
            echo "Release preparation did not advance the SDK version from ${MAIN_VERSION}; add a releasable Conventional Commit before promotion." >&2
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add packages/sdk/package.json packages/sdk/src/version.ts packages/sdk/CHANGELOG.md
          if ! git diff --quiet; then
            echo "Release preparation left generated files unstaged:" >&2
            git diff --name-only >&2
            exit 1
          fi
          git commit \
            --allow-empty \
            --message "chore(release): ${TAG}" \
            --message "${RELEASE_TRAILERS}"
          git push origin HEAD:dev
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
            echo "pushed=true"
            echo "run_url=${RUN_URL}"
          } >>"${GITHUB_OUTPUT}"
      - id: prepared-release
        name: Verify prepared release metadata
        if: steps.release-head.outputs.prepared == 'true'
        run: |
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          TAG="@viceme-ai/sdk@${VERSION}"
          SUBJECT="$(git log -1 --format=%s)"
          RUN_URL="$(git log -1 --format=%B | git interpret-trailers --parse | sed -n 's/^ViceMe-Release-Run: //p')"
          if [[ "${SUBJECT}" != "chore(release): ${TAG}" ]]; then
            echo "Prepared release subject ${SUBJECT} does not match package version ${TAG}" >&2
            exit 1
          fi
          if [[ ! "${RUN_URL}" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[0-9]+$ ]]; then
            echo "Prepared release commit has an invalid ViceMe-Release-Run trailer" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
            echo "pushed=false"
            echo "run_url=${RUN_URL}"
          } >>"${GITHUB_OUTPUT}"
      - name: Create or update dev to main Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag || steps.prepared-release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || steps.prepared-release.outputs.sha }}
          RUN_URL: ${{ steps.release.outputs.run_url || steps.prepared-release.outputs.run_url }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-pr.md"
          {
            echo "## Automated release"
            echo
            echo "This PR promotes the reviewed SDK changes from \`dev\` to \`main\` and releases **${TAG}** when merged."
            echo
            echo "The release preparation workflow automatically:"
            echo
            echo "- selected the stable semantic version from Conventional Commits;"
            echo '- updated the package/runtime version and generated `CHANGELOG.md`;'
            echo "- passed the complete SDK quality and tarball gates;"
            echo "- committed the generated release files to protected \`dev\` as the dedicated ViceMe Release App."
            echo
            echo "Prepared head: \`${RELEASE_SHA}\`  "
            echo "Evidence: ${RUN_URL}"
            echo
            echo "> Merging is the release approval: GitHub Actions creates the immutable tag, publishes npm, attaches GitHub assets, publishes both S3 regions, and sends the Feishu summary automatically."
          } >"${BODY_FILE}"

          PR_URL="$(gh pr list --state open --base main --head dev --json url --jq '.[0].url // empty')"
          if [[ -z "${PR_URL}" ]]; then
            gh pr create --base main --head dev --title "chore(release): ${TAG}" --body-file "${BODY_FILE}"
          else
            gh pr edit "${PR_URL}" --title "chore(release): ${TAG}" --body-file "${BODY_FILE}"
          fi
