name: POC SDK artifact recovery

# Recovery starts from the immutable npm package and tag. It never republishes
# npm, creates or moves a tag, or writes to the formal SDK release channels.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing immutable POC version, e.g. 0.1.7-poc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: viceme-sdk-poc-release
  cancel-in-progress: false

env:
  POC_PACKAGE: '@viceme-ai/sdk-poc'
  POC_PUBLIC_STORAGE_BASE: 'https://viceme-shop-storage-poc.preview.tencent-zeabur.cn/start'

jobs:
  recover:
    name: Recover immutable GitHub and POC S3 artifacts
    runs-on: ubuntu-latest
    environment: poc
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Validate POC recovery boundary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/poc" || {
            echo "::error::POC recovery must be dispatched from the exact poc branch"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-poc\.[0-9]+$ ]] || {
            echo "::error::version must match x.y.z-poc.N"
            exit 1
          }
          TAG="sdk-poc-v${VERSION}"
          git fetch origin --tags
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null || {
            echo "::error::immutable POC tag ${TAG} does not exist"
            exit 1
          }
      - name: Verify or recover immutable GitHub prerelease assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/attach-release-assets.mjs \
            --package "$POC_PACKAGE" \
            --version "$VERSION" \
            --tag "sdk-poc-v${VERSION}" \
            --prerelease \
            --semantic-zip-recovery
      - name: Fetch the exact published npm bytes
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/fetch-npm-dist.mjs --package "$POC_PACKAGE" --version "$VERSION" --out verified-dist
      - name: Publish exact POC S3 path and read it back
        env:
          VERSION: ${{ inputs.version }}
          S3_ENDPOINT: ${{ secrets.VICEME_POC_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.VICEME_POC_S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.VICEME_POC_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VICEME_POC_S3_SECRET_ACCESS_KEY }}
          EXPECT_BUCKET: start
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          test "$S3_BUCKET" = "start" || {
            echo "::error::VICEME_POC_S3_BUCKET must be start"
            exit 1
          }
          node scripts/publish-s3-region.mjs \
            --dist verified-dist \
            --prefix "poc/sdk/releases/v${VERSION}/" \
            --public-base "${POC_PUBLIC_STORAGE_BASE}/poc/sdk/releases/v${VERSION}/" \
            --label POC
