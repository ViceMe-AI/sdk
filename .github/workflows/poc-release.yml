name: POC SDK manual release

# POC is deliberately isolated from the formal @viceme-ai/sdk release chain:
# - manual dispatch from the exact poc branch only;
# - separate @viceme-ai/sdk-poc package and `poc` dist-tag;
# - exact-version assets under the POC RustFS `start` bucket;
# - no writes to main, latest, formal tags, or formal S3 buckets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable POC version, e.g. 0.2.0-poc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: viceme-sdk-poc-release
  cancel-in-progress: false

env:
  POC_PACKAGE: '@viceme-ai/sdk-poc'
  DIST_TAG: poc
  POC_API_BASE_URL: 'https://viceme-shop-web-poc.preview.tencent-zeabur.cn/api'
  POC_WIDGET_ORIGIN: 'https://viceme-shop-web-poc.preview.tencent-zeabur.cn'
  POC_PUBLIC_STORAGE_BASE: 'https://viceme-shop-storage-poc.preview.tencent-zeabur.cn/start'

jobs:
  metadata:
    name: Resolve exact POC source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: metadata
        name: Validate branch, version, and immutable tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/poc" || {
            echo "::error::POC release must be dispatched from the exact poc branch"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-poc\.[0-9]+$ ]] || {
            echo "::error::version must match x.y.z-poc.N"
            exit 1
          }
          TAG="sdk-poc-v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          git fetch origin --tags
          EXISTING_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$SHA" ]; then
            echo "::error::immutable tag $TAG already points to $EXISTING_SHA, not $SHA"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: POC source quality (exact SHA)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/scan-forbidden-patterns.mjs
      - run: |
          pnpm --filter '@viceme-ai/sdk' exec playwright install --with-deps chromium firefox webkit
          pnpm check

  tag:
    name: Create or verify immutable POC tag
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Tag exact source
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "$RELEASE_SHA"
            exit 0
          fi
          git tag --annotate "$TAG" "$RELEASE_SHA" --message "POC SDK release $TAG"
          git push origin "refs/tags/$TAG"

  npm-publish:
    name: Publish isolated POC npm package
    needs: [metadata, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.12.1
      - name: Verify trusted publisher OIDC context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: pnpm install --frozen-lockfile
      - name: Prepare and audit POC package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          VICEME_BUILD_CN_API_BASE_URL: ${{ env.POC_API_BASE_URL }}
          VICEME_BUILD_GLOBAL_API_BASE_URL: ${{ env.POC_API_BASE_URL }}
          VICEME_BUILD_CN_WIDGET_ORIGIN: ${{ env.POC_WIDGET_ORIGIN }}
          VICEME_BUILD_GLOBAL_WIDGET_ORIGIN: ${{ env.POC_WIDGET_ORIGIN }}
        run: |
          node scripts/prepare-poc-package.mjs --version "$VERSION"
          pnpm --dir packages/sdk build
          pnpm --dir packages/sdk pack:check
      - name: Publish or verify exact POC version
        run: node scripts/publish-or-verify.mjs

  artifacts:
    name: Publish GitHub and POC S3 artifacts
    needs: [metadata, npm-publish]
    runs-on: ubuntu-latest
    environment: poc
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Verify npm dist-tag and attach immutable prerelease assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node scripts/verify-npm-dist-tag.mjs \
            --package "$POC_PACKAGE" --version "$VERSION" --tag "$DIST_TAG"
          node scripts/attach-release-assets.mjs \
            --package "$POC_PACKAGE" --version "$VERSION" --tag "$TAG" --prerelease \
            --semantic-zip-recovery
      - name: Fetch the exact published npm bytes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/fetch-npm-dist.mjs --package "$POC_PACKAGE" --version "$VERSION" --out verified-dist
      - name: Publish exact POC S3 path and read it back
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          S3_ENDPOINT: ${{ secrets.VICEME_POC_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.VICEME_POC_S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.VICEME_POC_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VICEME_POC_S3_SECRET_ACCESS_KEY }}
          EXPECT_BUCKET: start
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          test "$S3_BUCKET" = "start" || {
            echo "::error::VICEME_POC_S3_BUCKET must be start"
            exit 1
          }
          node scripts/publish-s3-region.mjs \
            --dist verified-dist \
            --prefix "poc/sdk/releases/v${VERSION}/" \
            --public-base "${POC_PUBLIC_STORAGE_BASE}/poc/sdk/releases/v${VERSION}/" \
            --label POC
