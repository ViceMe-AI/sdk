name: Promote CDN

# Promotes an already-published npm release to the CDN (§14.2 steps 7-10).
#
# Flow: strictly validate inputs -> download the exact GitHub release
# artifacts -> re-verify digests locally -> per region, plan immutable
# uploads (missing => upload, byte-identical => skip, different => fail
# closed) -> upload -> public read-back -> (explicit input) move the stable
# `v1` alias by writing ONE pointer object per region -> bounded-convergence
# pointer/alias verification -> real-network loader smoke.
#
# Atomicity model:
#   - Exact versions live only under immutable /sdk/<version>/ objects and
#     are never overwritten (scripts/upload-plan.mjs enforces this).
#   - /sdk/v1 is NOT a copy of the files. Each region exposes a small public
#     pointer object `sdk/-/aliases/v1` whose body is exactly the version
#     string; the CDN edge resolves /sdk/v1/<file> to
#     /sdk/<pointer-version>/<file>. Moving the alias = one atomic object
#     write per region. Rollback = point at an older verified version.
#
# Security model (review P1):
#   - workflow_dispatch inputs are attacker-controllable text: they are
#     passed to scripts via env and referenced as double-quoted shell
#     variables, NEVER interpolated into script text by ${{ }}.
#   - Every job validates version/regions with scripts/validate-release-
#     inputs.mjs before any network, file, or credential operation.
#   - CDN_UPLOAD_COMMAND / CDN_PURGE_COMMAND secrets are expanded only
#     inside their explicit bash -lc invocation, never into script bodies.
#
# Required org configuration (§21.2):
#   - CDN buckets for cdn.viceme.cn (region `cn`) and cdn.viceme.ai
#     (region `global`).
#   - `CDN_UPLOAD_COMMAND` secret: invoked as `upload <region> <local-file>
#     <object-key>` (bash -lc). The region argument (`cn` | `global`)
#     selects that region's own bucket and credentials; the command must not
#     write outside the given object key and must set immutable long-cache
#     headers for /sdk/<version>/ keys and a short TTL for the pointer key.
#   - Optional `CDN_PURGE_COMMAND` secret: invoked as `purge <region> <key>`;
#     when present it runs after each pointer write so the read-back sees
#     origin state instead of a stale edge cache.
#   - Edge prerequisite: /sdk/v1/<file> resolution from the pointer above.
#     Until the edge implements it, alias verification fails closed — by
#     design, never silently.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact released version (e.g. 1.2.3)'
        required: true
        type: string
      regions:
        description: 'Regions to promote (comma-separated: cn,global)'
        required: true
        default: 'cn,global'
        type: string
      moveStableAlias:
        description: 'Also move the /sdk/v1 pointer to this version after verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: promote-cdn
  cancel-in-progress: false

jobs:
  verify-artifacts:
    name: Validate inputs, download + locally verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Strict input validation (before anything else)
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
        run: node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
      - name: Download release artifacts and verify digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "@viceme-ai/sdk@${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dist-*.zip' --dir release
          unzip -q release/dist-*.zip -d release/dist
          mkdir -p packages/sdk/dist && cp -r release/dist/. packages/sdk/dist/
          node scripts/verify-cdn.mjs --local packages/sdk/dist

  upload:
    name: Immutable exact-version upload + read-back (per region)
    needs: verify-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "@viceme-ai/sdk@${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dist-*.zip' --dir release
          unzip -q release/dist-*.zip -d release/dist
      - name: Plan immutable uploads, upload, and read back (per region)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
          CDN_UPLOAD_COMMAND: ${{ secrets.CDN_UPLOAD_COMMAND }}
        run: |
          set -euo pipefail
          node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
          if [ -z "$CDN_UPLOAD_COMMAND" ]; then
            echo "::error::CDN_UPLOAD_COMMAND secret is not configured (bucket provider pending — see promote-cdn.yml header and docs/RELEASE.md)"
            exit 1
          fi
          # The secret is expanded only inside this explicit bash invocation.
          upload() { bash -lc "$CDN_UPLOAD_COMMAND $1 $2 $3"; }
          for region in $(echo "$REGIONS" | tr ',' ' '); do
            case "$region" in
              cn) host=cdn.viceme.cn ;;
              global) host=cdn.viceme.ai ;;
            esac
            echo "::group::region ${region} (${host})"
            plan="$(node scripts/upload-plan.mjs --dist release/dist --base "https://${host}/sdk/${VERSION}/")"
            if [ -n "$plan" ]; then
              echo "$plan" | while IFS= read -r file; do
                upload "$region" "release/dist/$file" "sdk/${VERSION}/$file"
                echo "uploaded sdk/${VERSION}/$file"
              done
            else
              echo "all objects already present and byte-identical (idempotent re-run)"
            fi
            node scripts/verify-cdn.mjs --base "https://${host}/sdk/${VERSION}/"
            echo "::endgroup::"
          done

  alias:
    name: Move stable v1 pointer (explicit) + bounded verification + smoke
    needs: upload
    if: ${{ inputs.moveStableAlias }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Write the pointer (one atomic object per region) with convergence
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
          CDN_UPLOAD_COMMAND: ${{ secrets.CDN_UPLOAD_COMMAND }}
          CDN_PURGE_COMMAND: ${{ secrets.CDN_PURGE_COMMAND }}
        run: |
          set -euo pipefail
          node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
          if [ -z "$CDN_UPLOAD_COMMAND" ]; then
            echo "::error::CDN_UPLOAD_COMMAND secret is not configured"
            exit 1
          fi
          args=(
            --version "$VERSION"
            --regions "$REGIONS"
            --hosts cn=https://cdn.viceme.cn,global=https://cdn.viceme.ai
            --upload-command "$CDN_UPLOAD_COMMAND"
          )
          # Optional purge hook: without it, the pointer read-back converges
          # within the pointer's cache TTL instead of immediately.
          if [ -n "$CDN_PURGE_COMMAND" ]; then
            args+=(--purge-command "$CDN_PURGE_COMMAND")
          fi
          node scripts/write-alias-pointer.mjs "${args[@]}"
      - name: Verify the alias on every region (bounded retry for edge TTL)
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          # The edge may serve the previous alias resolution for up to the
          # pointer TTL; retry the whole verification with a bounded budget
          # (~5 minutes) instead of treating a stale edge as failure.
          for region in $(echo "$REGIONS" | tr ',' ' '); do
            case "$region" in
              cn) host=cdn.viceme.cn ;;
              global) host=cdn.viceme.ai ;;
            esac
            attempt=1
            until node scripts/verify-cdn.mjs \
                --base "https://${host}/sdk/v1/" \
                --expect-version "$VERSION" --allow-mutable-cache; do
              if [ "$attempt" -ge 10 ]; then
                echo "::error::alias did not converge to $VERSION on ${host} within the retry budget"
                exit 1
              fi
              echo "alias on ${host} not converged yet (attempt ${attempt}); waiting 30s"
              attempt=$((attempt + 1))
              sleep 30
            done
          done
      - name: Loader smoke against the live CDN
        run: |
          # B0.3 rehearsal: the loader must download and parse from the real
          # CDN through the v1 alias. Full capability E2E arrives with B1/B2.
          node - <<'EOF'
          const base = 'https://cdn.viceme.ai/sdk/v1/';
          const res = await fetch(new URL('manifest.json', base));
          if (!res.ok) throw new Error(`manifest HTTP ${res.status}`);
          const manifest = await res.json();
          const loader = await fetch(new URL(manifest.loader, base));
          if (!loader.ok) throw new Error(`loader HTTP ${loader.status}`);
          const text = await loader.text();
          if (!text.includes('data-viceme')) throw new Error('loader bundle looks wrong');
          console.log('cdn smoke ok', manifest.version);
          EOF
