name: Promote CDN

# Promotes an already-published npm release to the CDN (§14.2 steps 7-10).
#
# Artifact integrity chain (review P1): the verify-artifacts job downloads
# the GitHub release zip, verifies every digest locally, and forwards THOSE
# EXACT bytes to the upload job as a workflow artifact. The upload job
# re-verifies the same directory locally before any immutable write and
# never re-downloads from the release — a swapped or corrupted release
# asset can therefore never reach the immutable /sdk/<version>/ paths.
#
# Alias semantics (review P1): the /sdk/v1 pointer only moves FORWARD
# during a normal promote; moving it backward is a separate, explicit
# rollback action (aliasAction=rollback + aliasExpectedCurrent=<the exact
# version being rolled back FROM>), guarded against stale/concurrent moves.
#
# Security model (review P1): workflow_dispatch inputs are passed via env
# and validated (strict semver + region set) before any network, file, or
# credential operation; secrets expand only inside explicit bash -lc
# invocations. Actions are pinned to reviewed commit SHAs.
#
# Required org configuration (§21.2):
#   - CDN buckets for cdn.viceme.cn (region `cn`) and cdn.viceme.ai
#     (region `global`).
#   - `CDN_UPLOAD_COMMAND` secret: invoked as `upload <region> <local-file>
#     <object-key>` (bash -lc); the region selects its own bucket and
#     credentials; immutable long-cache headers for /sdk/<version>/ keys,
#     short TTL for the pointer key.
#   - Optional `CDN_PURGE_COMMAND` secret: invoked as `purge <region> <key>`;
#     when present it runs after each pointer write.
#   - Edge prerequisite: /sdk/v1/<file> resolution from the pointer. Until
#     the edge implements it, alias verification fails closed by design.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact released version (e.g. 1.2.3)'
        required: true
        type: string
      regions:
        description: 'Regions to promote (comma-separated: cn,global)'
        required: true
        default: 'cn,global'
        type: string
      moveStableAlias:
        description: 'Also move the /sdk/v1 pointer to this version after verification'
        required: true
        default: false
        type: boolean
      aliasAction:
        description: 'Pointer action: promote (forward only) or rollback (explicit, backward)'
        required: true
        default: promote
        type: choice
        options: [promote, rollback]
      aliasExpectedCurrent:
        description: 'rollback only: the exact version the pointer must currently hold'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: promote-cdn
  cancel-in-progress: false

jobs:
  verify-artifacts:
    name: Validate inputs, verify artifacts, forward exact bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Strict input validation (before anything else)
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
        run: node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
      - name: Download release artifacts and verify digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "@viceme-ai/sdk@${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dist-*.zip' --dir release
          unzip -q release/dist-*.zip -d verified-dist
          node scripts/verify-cdn.mjs --local verified-dist
      # Forward the EXACT verified bytes; the upload job never re-downloads.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-dist
          path: verified-dist/
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Immutable exact-version upload + read-back (per region)
    needs: verify-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-dist
          path: verified-dist
      - name: Re-verify the forwarded artifacts BEFORE any immutable write
        run: node scripts/verify-cdn.mjs --local verified-dist
      - name: Plan immutable uploads, upload, and read back (per region)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
          CDN_UPLOAD_COMMAND: ${{ secrets.CDN_UPLOAD_COMMAND }}
        run: |
          set -euo pipefail
          node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
          if [ -z "$CDN_UPLOAD_COMMAND" ]; then
            echo "::error::CDN_UPLOAD_COMMAND secret is not configured (bucket provider pending — see promote-cdn.yml header and docs/RELEASE.md)"
            exit 1
          fi
          # The secret is expanded only inside this explicit bash invocation.
          upload() { bash -lc "$CDN_UPLOAD_COMMAND $1 $2 $3"; }
          for region in $(echo "$REGIONS" | tr ',' ' '); do
            case "$region" in
              cn) host=cdn.viceme.cn ;;
              global) host=cdn.viceme.ai ;;
            esac
            echo "::group::region ${region} (${host})"
            plan="$(node scripts/upload-plan.mjs --dist verified-dist --base "https://${host}/sdk/${VERSION}/")"
            if [ -n "$plan" ]; then
              echo "$plan" | while IFS= read -r file; do
                upload "$region" "verified-dist/$file" "sdk/${VERSION}/$file"
                echo "uploaded sdk/${VERSION}/$file"
              done
            else
              echo "all objects already present and byte-identical (idempotent re-run)"
            fi
            node scripts/verify-cdn.mjs --base "https://${host}/sdk/${VERSION}/"
            echo "::endgroup::"
          done

  alias:
    name: Move /sdk/v1 pointer (promote forward, or explicit rollback)
    needs: upload
    if: ${{ inputs.moveStableAlias }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Write the pointer (policy-checked) with bounded convergence
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
          ALIAS_ACTION: ${{ inputs.aliasAction }}
          ALIAS_EXPECTED_CURRENT: ${{ inputs.aliasExpectedCurrent }}
          CDN_UPLOAD_COMMAND: ${{ secrets.CDN_UPLOAD_COMMAND }}
          CDN_PURGE_COMMAND: ${{ secrets.CDN_PURGE_COMMAND }}
        run: |
          set -euo pipefail
          node scripts/validate-release-inputs.mjs --version "$VERSION" --regions "$REGIONS"
          if [ "$ALIAS_ACTION" = "rollback" ]; then
            node scripts/validate-release-inputs.mjs --version "$ALIAS_EXPECTED_CURRENT"
          fi
          if [ -z "$CDN_UPLOAD_COMMAND" ]; then
            echo "::error::CDN_UPLOAD_COMMAND secret is not configured"
            exit 1
          fi
          args=(
            --version "$VERSION"
            --regions "$REGIONS"
            --hosts cn=https://cdn.viceme.cn,global=https://cdn.viceme.ai
            --upload-command "$CDN_UPLOAD_COMMAND"
            --mode "$ALIAS_ACTION"
          )
          if [ "$ALIAS_ACTION" = "rollback" ]; then
            args+=(--from-current "$ALIAS_EXPECTED_CURRENT")
          fi
          if [ -n "$CDN_PURGE_COMMAND" ]; then
            args+=(--purge-command "$CDN_PURGE_COMMAND")
          fi
          node scripts/write-alias-pointer.mjs "${args[@]}"
      - name: Verify the alias on every region (bounded retry for edge TTL)
        env:
          VERSION: ${{ inputs.version }}
          REGIONS: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          # The edge may serve the previous alias resolution for up to the
          # pointer TTL; retry the whole verification with a bounded budget
          # (~5 minutes) instead of treating a stale edge as failure.
          for region in $(echo "$REGIONS" | tr ',' ' '); do
            case "$region" in
              cn) host=cdn.viceme.cn ;;
              global) host=cdn.viceme.ai ;;
            esac
            attempt=1
            until node scripts/verify-cdn.mjs \
                --base "https://${host}/sdk/v1/" \
                --expect-version "$VERSION" --allow-mutable-cache; do
              if [ "$attempt" -ge 10 ]; then
                echo "::error::alias did not converge to $VERSION on ${host} within the retry budget"
                exit 1
              fi
              echo "alias on ${host} not converged yet (attempt ${attempt}); waiting 30s"
              attempt=$((attempt + 1))
              sleep 30
            done
          done
      - name: Loader smoke against the live CDN
        run: |
          # B0.3 rehearsal: the loader must download and parse from the real
          # CDN through the v1 alias. Full capability E2E arrives with B1/B2.
          node - <<'EOF'
          const base = 'https://cdn.viceme.ai/sdk/v1/';
          const res = await fetch(new URL('manifest.json', base));
          if (!res.ok) throw new Error(`manifest HTTP ${res.status}`);
          const manifest = await res.json();
          const loader = await fetch(new URL(manifest.loader, base));
          if (!loader.ok) throw new Error(`loader HTTP ${loader.status}`);
          const text = await loader.text();
          if (!text.includes('data-viceme')) throw new Error('loader bundle looks wrong');
          console.log('cdn smoke ok', manifest.version);
          EOF
