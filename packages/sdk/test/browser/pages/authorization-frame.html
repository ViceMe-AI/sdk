<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>authorization frame</title>
  </head>
  <body>
    <button id="continue" type="button">继续授权</button>
    <p id="result" hidden>已点击</p>
    <script>
      document.querySelector('#continue').addEventListener('click', () => {
        document.querySelector('#result').hidden = false;
      });
    </script>
  </body>
</html>
