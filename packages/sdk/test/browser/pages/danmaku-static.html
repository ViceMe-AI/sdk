<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViceMe danmaku host fixture</title>
    <style>
      body {
        min-height: 3200px;
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        padding: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Third-party host page</h1>
      <button id="host-action" type="button">Host action</button>
      <output id="host-status">idle</output>
    </main>
    <script>
      window.__events = [];
      for (const type of [
        'viceme:ready',
        'viceme:capability-ready',
        'viceme:error',
        'viceme:destroyed',
      ]) {
        document.addEventListener(type, (event) => {
          window.__events.push({ type, detail: event.detail });
        });
      }
      document.querySelector('#host-action').addEventListener('click', () => {
        document.querySelector('#host-status').textContent = 'clicked';
      });
    </script>
    <!-- prettier-ignore -->
    <script
      defer src="/viceme-sdk/v1/viceme.min.js" data-viceme-work="wrk_test" data-viceme-region="cn"
      data-viceme-features="danmaku" data-viceme-target="body"
      data-viceme-theme="auto"></script>
  </body>
</html>
