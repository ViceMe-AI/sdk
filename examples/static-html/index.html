<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViceMe hosted danmaku example</title>
    <style>
      body {
        min-height: 180vh;
        margin: 0;
        padding: 2rem;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Third-party host page</h1>
      <p>The host adds no SDK CSS or API calls. Replace the public work key below.</p>
      <button type="button">Host-page action</button>
    </main>
    <!-- prettier-ignore -->
    <script
      defer src="https://viceme.cn/viceme-sdk/v1/viceme.min.js" data-viceme-work="wrk_public_example" data-viceme-region="cn"
      data-viceme-features="danmaku" data-viceme-target="body"
      data-viceme-theme="auto"></script>
  </body>
</html>
